services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agent_memory
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agent -d agent_memory']
      interval: 3s
      retries: 15
